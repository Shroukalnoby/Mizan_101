<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mizan Budget</title>
<meta name="theme-color" content="#F2F8F4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mizan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="fonts.css">
<style>
/* ==========================================================================
   DESIGN TOKENS & THEME SYSTEM
   Calm sage/emerald & soft mint palette with automatic/manual dark mode
   ========================================================================== */
:root {
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --bg: #F2F8F4;
  --surface: #FFFFFF;
  --surface-alt: #F8FBF9;
  --ink: #14221D;
  --muted: #566860;
  --line: #D5DFD9;
  --line-soft: #E6ECE8;
  --accent: #1E6B5A;
  --accent-soft: #E3F1EC;
  --accent-ink: #FFFFFF;
  --warn: #B3341F;
  --warn-soft: #FCECE9;
  --gold: #B67B14;
  --gold-soft: #FDF5E6;
  --hatch: #C5D1CA;
  --scrim: rgba(10, 20, 16, 0.48);
  --shadow-sm: 0 2px 8px rgba(20, 34, 29, 0.04);
  --shadow-md: 0 8px 24px rgba(20, 34, 29, 0.08);
  --shadow-lg: 0 16px 40px rgba(10, 20, 16, 0.18);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1814;
    --surface: #16231E;
    --surface-alt: #1B2B25;
    --ink: #E7EFEA;
    --muted: #93A59C;
    --line: #2B3C35;
    --line-soft: #1F2D27;
    --accent: #4FB89B;
    --accent-soft: rgba(79, 184, 155, 0.14);
    --accent-ink: #0B1512;
    --warn: #F28C77;
    --warn-soft: rgba(242, 140, 119, 0.14);
    --gold: #E6B34B;
    --gold-soft: rgba(230, 179, 75, 0.14);
    --hatch: #35473F;
    --scrim: rgba(0, 0, 0, 0.65);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0F1814;
  --surface: #16231E;
  --surface-alt: #1B2B25;
  --ink: #E7EFEA;
  --muted: #93A59C;
  --line: #2B3C35;
  --line-soft: #1F2D27;
  --accent: #4FB89B;
  --accent-soft: rgba(79, 184, 155, 0.14);
  --accent-ink: #0B1512;
  --warn: #F28C77;
  --warn-soft: rgba(242, 140, 119, 0.14);
  --gold: #E6B34B;
  --gold-soft: rgba(230, 179, 75, 0.14);
  --hatch: #35473F;
  --scrim: rgba(0, 0, 0, 0.65);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--font-body);
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font-family: inherit; }
button:focus-visible, input:focus-visible, .cat-card:focus-visible, .style-opt:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.ico {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.wrap {
  max-width: 580px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ==========================================================================
   CLEAN TOP HEADER & NAVIGATION
   ========================================================================== */
.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.header-start {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.menu-trigger {
  inline-size: 44px;
  block-size: 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
}
.menu-trigger:hover {
  border-color: var(--accent);
  background: var(--surface-alt);
}
.menu-trigger:active { transform: scale(0.96); }
.menu-trigger .ico { inline-size: 22px; block-size: 22px; }

.brand-group {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-row h1 {
  font: 600 24px/1.1 var(--font-display);
  margin: 0;
  letter-spacing: -0.02em;
}

.style-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 3px 9px;
  border-radius: 999px;
  border: 0;
  cursor: pointer;
  white-space: nowrap;
}
.style-pill:hover { filter: brightness(0.96); }

.pro-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--gold);
  background: var(--gold-soft);
  padding: 2px 7px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.month-pill {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 6px;
  box-shadow: var(--shadow-sm);
}
.month-pill b {
  font: 500 13.5px var(--font-display);
  padding-inline: 6px;
  white-space: nowrap;
}
.month-pill .icon-btn {
  inline-size: 30px;
  block-size: 30px;
  border-radius: 50%;
}
:root[dir="rtl"] .chev { transform: scaleX(-1); }

/* Main 3-Tab Switcher */
.tabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 4px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.tabs button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 500 14px var(--font-body);
  padding: 9px 8px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.tabs button:hover:not([aria-current="page"]) { color: var(--ink); }
.tabs button[aria-current="page"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}

/* Example Banner (compact & dismissible) */
.example-banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  font-size: 13.5px;
}
.example-banner p { margin: 0; flex: 1 1 220px; color: var(--muted); }
.example-banner .ex-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Shared Inputs & Buttons */
.cap { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
.amt, .sel {
  width: 100%;
  min-width: 0;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
  font: 400 16px var(--font-body);
}
.amt { direction: ltr; text-align: end; font-variant-numeric: tabular-nums; }
.amt.txt { direction: inherit; text-align: start; }
.amt.dt { text-align: start; }
.amt::placeholder { color: var(--muted); opacity: 0.6; }
.amt:focus, .sel:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.amt[aria-invalid="true"] { border-color: var(--warn); }

.field {
  min-width: 0;
  background: transparent;
  color: var(--ink);
  border: 0;
  border-bottom: 1px dashed var(--line);
  border-radius: 0;
  padding: 5px 0;
  font: 400 16px var(--font-body);
}
.field::placeholder { color: var(--muted); opacity: 0.7; }
.field:focus { outline: none; border-bottom: 1px solid var(--accent); box-shadow: 0 1px 0 var(--accent); }

.icon-btn {
  inline-size: 36px;
  block-size: 36px;
  flex: none;
  border-radius: 10px;
  border: 0;
  background: transparent;
  color: var(--muted);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
}
.icon-btn:hover { background: var(--line-soft); color: var(--ink); }
.icon-btn.armed, .tool.armed { background: var(--warn); color: var(--bg); border-color: var(--warn); }
.icon-btn.armed { inline-size: auto; padding-inline: 10px; font: 500 12.5px var(--font-body); white-space: nowrap; }

.btn {
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  font: 600 15px var(--font-body);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: filter 0.15s, transform 0.1s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: scale(0.98); }

.btn-outline {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 18px;
  font: 600 15px var(--font-body);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-outline:hover { border-color: var(--accent); background: var(--surface-alt); }

.tool {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 9px;
  padding: 7px 12px;
  font: 500 13px var(--font-body);
  cursor: pointer;
}
.tool:hover { border-color: var(--accent); }
.link-btn {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 0;
  padding: 6px 0;
  color: var(--accent);
  font: 500 14px var(--font-body);
  cursor: pointer;
}
.warnmsg { margin: 0; color: var(--warn); font-weight: 500; font-size: 13.5px; }

/* ==========================================================================
   HOME VIEW: STREAMLINED HERO + CLEAN CATEGORY CARDS
   ========================================================================== */
.home-stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Hero Overview Card */
.hero-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.hero-top {
  display: flex;
  align-items: center;
  gap: 20px;
}

.ring-box {
  position: relative;
  inline-size: 116px;
  block-size: 116px;
  flex: none;
}
.ring-box svg {
  inline-size: 100%;
  block-size: 100%;
  display: block;
}
.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
}
.ring-center b {
  font: 600 19px/1.1 var(--font-display);
  font-variant-numeric: tabular-nums;
}
.ring-center span {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.hero-metrics {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.balance-block {
  display: flex;
  flex-direction: column;
}
.balance-block .lbl {
  font-size: 12.5px;
  color: var(--muted);
  font-weight: 500;
}
.balance-block .val {
  font: 600 28px/1.15 var(--font-display);
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  direction: ltr;
  text-align: start;
}
.balance-block.neg .val { color: var(--warn); }

.mini-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
}
.mini-stat {
  display: flex;
  flex-direction: column;
}
.mini-stat span { font-size: 11.5px; color: var(--muted); }
.mini-stat b {
  font: 600 15px/1.25 var(--font-display);
  font-variant-numeric: tabular-nums;
  direction: ltr;
  text-align: start;
}
.mini-stat b.in-col { color: var(--accent); }
.mini-stat b.out-col { color: var(--warn); }

/* Primary Quick Action Buttons */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.qa-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 16px;
  border-radius: 14px;
  border: 0;
  font: 600 15px var(--font-body);
  cursor: pointer;
  transition: transform 0.12s, filter 0.15s;
}
.qa-btn:active { transform: scale(0.98); }
.qa-btn .ico { inline-size: 20px; block-size: 20px; stroke-width: 2.4; }
.qa-btn.expense {
  background: var(--warn-soft);
  color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent);
}
.qa-btn.expense:hover { filter: brightness(0.96); }
.qa-btn.income {
  background: var(--accent);
  color: var(--accent-ink);
}
.qa-btn.income:hover { filter: brightness(1.07); }

/* Section Header */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-inline: 2px;
}
.sec-head h2 {
  margin: 0;
  font: 600 16px var(--font-display);
}
.sec-head span {
  font-size: 12.5px;
  color: var(--muted);
}

/* Clean 2-Column Category Grid */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
@media (max-width: 390px) {
  .cat-grid { grid-template-columns: 1fr; }
}

.cat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: start;
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s, transform 0.12s, box-shadow 0.2s;
}
.cat-card:hover {
  border-color: var(--c, var(--accent));
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.cat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.cat-icon {
  inline-size: 36px;
  block-size: 36px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--c, var(--accent)) 13%, var(--surface));
  color: var(--c, var(--accent));
  display: grid;
  place-items: center;
}
.cat-icon .ico { inline-size: 20px; block-size: 20px; }

.cat-pct {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  background: var(--surface-alt);
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--line-soft);
  font-variant-numeric: tabular-nums;
}
.cat-pct.over {
  color: var(--warn);
  background: var(--warn-soft);
  border-color: transparent;
}

.cat-title {
  font: 600 15.5px/1.25 var(--font-display);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cat-nums {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}
.cat-spent {
  font: 600 15px var(--font-display);
  direction: ltr;
}
.cat-spent.over { color: var(--warn); }
.cat-plan {
  font-size: 12px;
  color: var(--muted);
  direction: ltr;
}

.cat-bar {
  block-size: 6px;
  border-radius: 999px;
  background: var(--line-soft);
  overflow: hidden;
}
.cat-bar i {
  display: block;
  block-size: 100%;
  background: var(--c, var(--accent));
  border-radius: 999px;
  transition: width 0.3s ease;
}
.cat-bar.over i { background: var(--warn); }

.cat-card.add-card {
  border-style: dashed;
  background: transparent;
  align-items: center;
  justify-content: center;
  min-block-size: 126px;
  color: var(--muted);
  box-shadow: none;
}
.cat-card.add-card:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--surface);
}

/* ==========================================================================
   PAYMENTS TAB
   ========================================================================== */
.figures { display: flex; flex-wrap: wrap; gap: 12px 28px; }
.figures b { display: block; font: 600 20px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.pbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.plist {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.prec {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  inline-size: 100%;
  text-align: start;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  padding: 13px 14px;
  color: var(--ink);
  cursor: pointer;
  font: inherit;
}
.prec:last-child { border-bottom: 0; }
.prec:hover { background: var(--surface-alt); }
.prec .p-ico {
  inline-size: 36px;
  block-size: 36px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--c, var(--muted)) 12%, var(--surface));
  color: var(--c, var(--muted));
  display: grid;
  place-items: center;
}
.prec .p-ico .ico { inline-size: 19px; block-size: 19px; }
.prec .t { min-width: 0; }
.prec .t b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prec .t span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prec .v { font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; }
.prec .v.neg { color: var(--warn); }
.prec .v.pos { color: var(--accent); }
.empty { margin: 0; padding: 20px; text-align: center; color: var(--muted); background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--line); }

/* ==========================================================================
   PLAN TAB (ADAPTS TO BUDGETING STYLE: VALUES / EXPENSES / PERCENTAGE)
   ========================================================================== */
.income-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 104px;
  gap: 12px;
  align-items: end;
}
.amt.big { font: 600 24px var(--font-display); padding: 9px 12px; text-align: start; }
.amt.cur { font: 600 18px var(--font-display); padding: 11px 10px; text-align: center; }

.summary {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px;
}
.bar-wrap { position: relative; margin-block: 16px 12px; }
.bar { display: flex; block-size: 18px; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.sg { flex: none; block-size: 100%; border-inline-end: 2px solid var(--surface); transition: width 0.25s; }
.sg.un { background: repeating-linear-gradient(135deg, var(--hatch) 0 4px, transparent 4px 8px); border-inline-end: 0; }
.tick { position: absolute; inset-block: -4px; inline-size: 2px; background: var(--ink); border-radius: 1px; }
.status { margin: 0; font-weight: 500; font-size: 14px; }
.status.over { color: var(--warn); }
.status.full { color: var(--accent); }
.legend { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 20px; }
.legend li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sw { inline-size: 10px; block-size: 10px; border-radius: 3px; flex: none; }

function two(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
var TODAY = ymd(new Date());
var CUR_MONTH = TODAY.slice(0, 7);
var viewMonth = CUR_MONTH;
var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function shiftMonth(ym, delta) {
  var d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + delta, 1);
  return d.getFullYear() + '-' + two(d.getMonth() + 1);
}
function defaultDate() { return viewMonth === CUR_MONTH ? TODAY : viewMonth + '-01'; }
function uid() { return Math.random().toString(36).slice(2, 9); }
function isObj(x) { return x && typeof x === 'object'; }

function buildValuesForStyle(styleKey, income) {
  var preset = STYLE_PRESETS[styleKey] || STYLE_PRESETS.values;
  return preset.map(function(d, vi) {
    var calcPlanned = styleKey === 'percentage' ? Math.round((income || 20000) * (d.pct / 100)) : d.planned;
    return {
      id: styleKey.slice(0, 2) + '_v' + vi + '_' + uid().slice(0, 3),
      k: d.k,
      name: null,
      why: null,
      color: PAL[d.c % PAL.length],
      icon: ICON_BY_K[d.k] || PICKABLE[vi % PICKABLE.length],
      planned: calcPlanned,
      pct: d.pct || 0,
      items: d.items.map(function(key, ii) {
        return { id: styleKey.slice(0, 2) + '_i' + vi + ii + '_' + uid().slice(0, 3), k: key, name: null };
      })
    };
  });
}

function buildExamplePayments(styleKey, values) {
  var out = [];
  var list = EXAMPLE_PAYMENTS_BY_STYLE[styleKey] || [];
  list.forEach(function(e) {
    values.forEach(function(v) {
      if (e[0] === '@' + v.k) {
        out.push({ id: uid(), amount: e[1], note: '', date: TODAY, vid: v.id, iid: null, ex: true });
      }
      v.items.forEach(function(i) {
        if (i.k === e[0]) {
          out.push({ id: uid(), amount: e[1], note: '', date: TODAY, vid: v.id, iid: i.id, ex: true });
        }
      });
    });
  });
  return out;
}

function freshState() {
  var inc = 20000;

    values: buildValuesForStyle('values', inc),

  };
  return {

    pro: false,

function sane(o) {
  if (!isObj(o)) return null;
  var inc = +o.income || 0;
  var style = (o.style === 'expenses' || o.style === 'percentage') ? o.style : 'values';
  if (!isObj(o.profiles)) {
    o.profiles = {
      values: Array.isArray(o.values) ? o.values : buildValuesForStyle('values', inc || 20000),
      expenses: buildValuesForStyle('expenses', inc || 20000),
      percentage: buildValuesForStyle('percentage', inc || 20000)
    };
  }
  ['values', 'expenses', 'percentage'].forEach(function(sk) {
    if (!Array.isArray(o.profiles[sk])) o.profiles[sk] = buildValuesForStyle(sk, inc || 20000);
    o.profiles[sk] = o.profiles[sk].filter(isObj).map(function(v, vi) {
      v.id = v.id || uid();
      v.color = v.color || PAL[vi % PAL.length];
      v.icon = ICONS[v.icon] ? v.icon : (ICON_BY_K[v.k] || PICKABLE[vi % PICKABLE.length]);
      v.planned = +v.planned || 0;
      v.pct = +v.pct || (inc > 0 ? Math.round(v.planned / inc * 100) : 0);
      v.items = (Array.isArray(v.items) ? v.items : []).filter(isObj).map(function(i) {
        i.id = i.id || uid();
        return i;
      });
      return v;
    });
  });
  o.style = style;
  o.values = o.profiles[style];
  o.payments = Array.isArray(o.payments) ? o.payments.filter(isObj).map(function(p) {
    return {
      id: p.id || uid(),
      amount: +p.amount > 0 ? +p.amount : 0,
      note: String(p.note || ''),
      date: DATE_RE.test(p.date) ? p.date : TODAY,
      vid: p.vid || null,
      iid: p.iid || null,
      ex: !!p.ex
    };
  }) : [];
  o.incomes = Array.isArray(o.incomes) ? o.incomes.filter(isObj).map(function(x) {
    return {
      id: x.id || uid(),
      amount: +x.amount > 0 ? +x.amount : 0,
      note: String(x.note || ''),
      date: DATE_RE.test(x.date) ? x.date : TODAY,
      ex: !!x.ex
    };
  }) : [];
  o.v = 4;
  o.income = inc;
  o.lang = o.lang === 'ar' ? 'ar' : 'en';
  o.theme = (o.theme === 'light' || o.theme === 'dark') ? o.theme : 'auto';
  o.pro = !!o.pro;
  o.currency = typeof o.currency === 'string' ? o.currency : 'EGP';
  o.t = +o.t || 0;
  o.example = !!o.example;
  return o;
}

    .replace(/[٠-٩]/g, function(d) { return AR_DIGITS.indexOf(d); })

function heroRingHTML(sb, inc, spent) {
  var R = 42, C = 2 * Math.PI * R;
  var segs = [], total = 0;
  state.values.forEach(function(v) {
    var s = sb[v.id] || 0;
    if (s > 0) { segs.push({ c: v.color, s: s }); total += s; }
  });
  if (sb[''] > 0) { segs.push({ c: 'var(--muted)', s: sb[''] }); total += sb['']; }

  var baseTotal = Math.max(inc, total);
  var circles = '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke-width="11" style="stroke:var(--line-soft)"/>';
  if (baseTotal > 0 && total > 0) {
    var off = 0, gap = segs.length > 1 ? 1.5 : 0;
    segs.forEach(function(sg) {
      var len = (sg.s / baseTotal) * C;
      var dash = Math.max(len - gap, 0.5);
      circles += '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke-width="11" stroke-linecap="round" ' +
        'style="stroke:' + sg.c + '" stroke-dasharray="' + dash + ' ' + (C - dash) + '" ' +
        'stroke-dashoffset="' + (-off) + '" transform="rotate(-90 50 50)"/>';
      off += len;
    });
  }
  var pctUsed = inc > 0 ? Math.round((spent / inc) * 100) : (spent > 0 ? 100 : 0);
  return '<div class="ring-box">' +
    '<svg viewBox="0 0 100 100" aria-hidden="true">' + circles + '</svg>' +
    '<div class="ring-center"><b>' + pctUsed + '%</b><span>' + esc(T().kSpent) + '</span></div>' +
  '</div>';
}

function renderSummary() {
  var el = document.getElementById('summary');
  if (!el) return;
  var t = T(), inc = state.income || 0, plan = 0, pctSum = 0, spent = spentTotal();
  state.values.forEach(function(v) {
    plan += v.planned || 0;
    pctSum += +v.pct || 0;
  });

  var total = Math.max(inc, plan), segs = '', tick = '';
  if (total > 0) {
    state.values.forEach(function(v) {
      if (v.planned > 0) {
        segs += '<i class="sg" style="width:' + (v.planned / total * 100) + '%;background:' + esc(v.color) + '"></i>';
      }
    });
    if (inc > plan) segs += '<i class="sg un" style="width:' + ((inc - plan) / total * 100) + '%"></i>';
    if (plan > inc && inc > 0) tick = '<span class="tick" style="inset-inline-start:' + (inc / total * 100) + '%"></span>';
  }

  var cls = '', msg;
  if (state.style === 'percentage') {
    if (pctSum === 100) { cls = 'full'; msg = t.full + ' (100%)'; }
    else if (pctSum > 100) { cls = 'over'; msg = t.pctTotalMsg(pctSum) + ' (>100%)'; }
    else { msg = t.pctTotalMsg(pctSum); }
  } else {
    if (inc <= 0) msg = t.noIncome;
    else if (Math.abs(inc - plan) < 0.005) { cls = 'full'; msg = t.full; }
    else if (inc > plan) msg = t.unassignedMsg(money(inc - plan));
    else { cls = 'over'; msg = t.overMsg(money(plan - inc)); }
  }

  var legend = state.values.map(function(v) {
    var pc = state.style === 'percentage' ? (v.pct || 0) : pctOf(v.planned || 0);
    return '<li><i class="sw" style="background:' + esc(v.color) + '"></i>' +
      '<span class="ln">' + esc(vName(v) || '—') + '</span>' +
      '<span class="lv">' + esc(fmtN.format(v.planned || 0)) + (pc === null ? '' : ' · ' + pc + '%') + '</span></li>';
  }).join('');

  el.innerHTML =
    '<div class="figures">' +
      '<div><span class="cap">' + esc(t.sumIncome) + '</span><b>' + esc(money(inc)) + '</b></div>' +
      '<div><span class="cap">' + esc(t.sumPlanned) + '</span><b>' + esc(money(plan)) + '</b></div>' +
      '<div><span class="cap">' + esc(t.sumSpent) + '</span><b>' + esc(money(spent)) + '</b></div>' +
    '</div>' +
    '<div class="bar-wrap"><div class="bar">' + segs + '</div>' + tick + '</div>' +
    '<p class="status ' + cls + '">' + esc(msg) + '</p>' +
    '<ul class="legend">' + legend + '</ul>';
}

function updateTotals() {
  var t = T(), sv = spentByValue(), si = spentByItem();
  state.values.forEach(function(v) {
    var p = v.planned || 0, s = sv[v.id] || 0;
    var a = app.querySelector('[data-vt="' + v.id + '"]');
    var b = app.querySelector('[data-vsp="' + v.id + '"]');
    var c = app.querySelector('[data-vcalc="' + v.id + '"]');
    var m = app.querySelector('[data-vm="' + v.id + '"]');
    if (a) a.textContent = t.vPlanned(pctOf(p));
    if (c) c.textContent = fmtN.format(p);
    if (b) {
      b.textContent = fmtN.format(s);
      b.classList.toggle('over', p > 0 && s > p);
    }
    if (m) {
      m.classList.toggle('over', p > 0 && s > p);
      m.firstChild.style.width = (p > 0 ? Math.min(100, s / p * 100) : (s > 0 ? 100 : 0)) + '%';
    }
    v.items.forEach(function(it) {
      var el = app.querySelector('[data-sp="' + it.id + '"]');
      if (el) el.textContent = fmtN.format(si[it.id] || 0);
    });
  });
}

   MODALS: TRANSACTION SHEET, TUTORIAL VIDEO PLAYER, & BUYING OPTIONS
   ========================================================================== */
function openSheet(mode, opts) {
  opts = opts || {};
  var list = mode === 'income' ? state.incomes : state.payments;
  var ed = opts.editId ? list.filter(function(r) { return r.id === opts.editId; })[0] : null;
  var defaultVid = ed ? (ed.vid || '') : (opts.vid || (state.values.length === 1 ? state.values[0].id : ''));
  lastFocus = document.activeElement;
  activeModal = {
    type: 'sheet',
    mode: mode,
    editId: ed ? ed.id : null,
    amount: ed ? String(ed.amount) : '',
    vid: defaultVid,
    iid: ed ? (ed.iid || '') : '',
    note: ed ? ed.note : '',
    date: ed ? ed.date : defaultDate(),
    manual: !!ed || !!opts.vid
  };
  renderModal();
  setTimeout(function() {
    var a = document.getElementById('sAmount');
    if (a) { a.focus(); a.select(); }
  }, 20);
}

function openTutorial() {
  stopTutTimer();
  drawerOpen = false;
  renderDrawer();
  activeModal = { type: 'tutorial', step: 0, playing: true };
  tutProg = 0;
  renderModal();
  startTutTimer();
}

function startTutTimer() {
  stopTutTimer();
  if (!activeModal || activeModal.type !== 'tutorial' || !activeModal.playing) return;
  tutTimer = setInterval(function() {
    tutProg += 5;
    if (tutProg >= 100) {
      tutProg = 0;
      var steps = T().tutSteps;
      if (activeModal.step < steps.length - 1) {
        activeModal.step++;
      } else {
        activeModal.playing = false;
        stopTutTimer();
      }
      renderModal();
    } else {
      var activeBar = modalRoot.querySelector('.video-progress button.active');
      if (activeBar) activeBar.style.setProperty('--prog', tutProg + '%');
    }
  }, 200);
}

function stopTutTimer() {
  if (tutTimer) { clearInterval(tutTimer); tutTimer = null; }
}

function openBuyModal() {
  drawerOpen = false;
  renderDrawer();
  activeModal = { type: 'buy' };
  renderModal();
}

function closeModal() {
  stopTutTimer();
  activeModal = null;
  modalRoot.innerHTML = '';
  if (lastFocus && lastFocus.isConnected) {
    try { lastFocus.focus(); } catch (e) {}
  }
}

        '</div>' +
      '</div></div>';
    return;
  }

  if (activeModal.type === 'buy') {
    modalRoot.innerHTML =
      '<div class="scrim" data-act="closeModal"><div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="shead"><h2>' + esc(t.buyTitle) + '</h2><button type="button" class="icon-btn" data-act="closeModal" aria-label="' + esc(t.cancel) + '">' + ico('close') + '</button></div>' +
        '<p style="margin:0;color:var(--muted);font-size:14px">' + esc(t.buySubtitle) + '</p>' +
        '<div class="plans-grid">' +
          /* Free Tier */
          '<div class="plan-tier">' +
            '<div class="tier-head"><h3>' + esc(t.tierFreeName) + '</h3><span class="tier-price">' + esc(t.tierFreePrice) + ' <small>' + esc(t.tierFreePeriod) + '</small></span></div>' +
            '<ul class="tier-feats">' + t.tierFreeFeats.map(function(f) { return '<li>' + ico('check') + '<span>' + esc(f) + '</span></li>'; }).join('') + '</ul>' +
            '<button type="button" class="btn-outline" disabled style="opacity:0.75">' + esc(t.tierFreeBtn) + '</button>' +
          '</div>' +
          /* Pro Lifetime Tier */
          '<div class="plan-tier featured">' +
            '<span class="tier-tag">' + esc(t.tierProTag) + '</span>' +
            '<div class="tier-head"><h3>' + esc(t.tierProName) + '</h3><span class="tier-price">' + esc(t.tierProPrice) + ' <small>' + esc(t.tierProPeriod) + '</small></span></div>' +
            '<ul class="tier-feats">' + t.tierProFeats.map(function(f) { return '<li>' + ico('check') + '<span>' + esc(f) + '</span></li>'; }).join('') + '</ul>' +
            '<button type="button" class="btn" data-act="activatePro" data-tier="pro">' + ico('crown') + '<span>' + esc(state.pro ? t.tierProActive : t.tierProBtn) + '</span></button>' +
          '</div>' +
          /* Family & Cloud Tier */
          '<div class="plan-tier">' +
            '<div class="tier-head"><h3>' + esc(t.tierPlusName) + '</h3><span class="tier-price">' + esc(t.tierPlusPrice) + ' <small>' + esc(t.tierPlusPeriod) + '</small></span></div>' +
            '<ul class="tier-feats">' + t.tierPlusFeats.map(function(f) { return '<li>' + ico('check') + '<span>' + esc(f) + '</span></li>'; }).join('') + '</ul>' +
            '<button type="button" class="btn-outline" data-act="activatePro" data-tier="plus">' + esc(t.tierPlusBtn) + '</button>' +
          '</div>' +
        '</div>' +
      '</div></div>';
  }
}

/* ==========================================================================
   MAIN SHELL RENDERER
   ========================================================================== */
function renderAll(keepDrawer) {
  applyThemeAndLang();
  var t = T();
  var styleBadge = state.style === 'expenses' ? t.styleBadgeExpenses : (state.style === 'percentage' ? t.styleBadgePercentage : t.styleBadgeValues);
  var body = view === 'home' ? homeHTML() : (view === 'payments' ? paymentsHTML() : planHTML());

  app.innerHTML =
    '<div class="wrap">' +
      '<header class="top-header">' +
        '<div class="header-start">' +
          '<button class="menu-trigger" data-act="openDrawer" aria-label="' + esc(t.menuOpen) + '">' + ico('menu') + '</button>' +
          '<div class="brand-group">' +
            '<div class="brand-row">' +
              '<h1>' + esc(t.brand) + '</h1>' +
              (state.pro ? '<span class="pro-badge">PRO</span>' : '') +
            '</div>' +
            '<button class="style-pill" data-act="openDrawer" title="' + esc(t.secStyles) + '">' +
              '<span>' + esc(styleBadge) + '</span>' +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div class="month-pill">' +
          '<button class="icon-btn" data-act="monthPrev" aria-label="' + esc(t.prevMonth) + '">' + ico('prev', 'chev') + '</button>' +
          '<b>' + esc(monthLabelFor(viewMonth)) + '</b>' +
          '<button class="icon-btn" data-act="monthNext" aria-label="' + esc(t.nextMonth) + '">' + ico('next', 'chev') + '</button>' +
        '</div>' +
      '</header>' +

      '<nav class="tabs" aria-label="' + esc(t.brand) + '">' +
        ['home', 'payments', 'plan'].map(function(k) {
          var lab = k === 'home' ? t.tabHome : (k === 'payments' ? t.tabPayments : t.tabPlan);
          return '<button data-act="tab" data-view="' + k + '"' + (view === k ? ' aria-current="page"' : '') + '>' + esc(lab) + '</button>';
        }).join('') +
      '</nav>' +

      (iosHint() ? '<div class="example-banner"><p>' + esc(t.installHint) + '</p><div class="ex-actions"><button class="tool" data-act="hintOk">' + esc(t.gotIt) + '</button></div></div>' : '') +
      (state.example ? '<div class="example-banner"><p>' + esc(t.exampleText) + '</p><div class="ex-actions"><button class="tool" data-act="zero">' + esc(t.exampleClear) + '</button><button class="tool" data-act="dismiss">' + esc(t.exampleDismiss) + '</button></div></div>' : '') +

      body +
    '</div>';

  if (view === 'plan') {
    renderSummary();
    updateTotals();
  }
  if (!keepDrawer) renderDrawer();
}

/* ==========================================================================
   EVENT HANDLING & ACTIONS
   ========================================================================== */
function saveSheet() {
  if (!activeModal || activeModal.type !== 'sheet') return;

  var ai = document.getElementById('sAmount');
  var ni = document.getElementById('sNote');
  var di = document.getElementById('sDate');

  /* Always read directly from live DOM inputs as fallback in case of autofill/IME */
  var rawAmt = ai ? ai.value : activeModal.amount;
  var rawNote = ni ? ni.value : activeModal.note;
  var rawDate = di ? di.value : activeModal.date;

  var amt = parseNum(rawAmt);
  var ok = true;

  if (!amt) {
    if (ai) ai.setAttribute('aria-invalid', 'true');
    ok = false;
  }
  if (activeModal.mode === 'expense' && !findV(activeModal.vid)) {
    var vs = document.getElementById('sVals'), er = document.getElementById('sErr');
    if (vs) vs.classList.add('bad');
    if (er) er.hidden = false;
    ok = false;
  }
  if (!ok) {
    if (!amt && ai) ai.focus();
    return;
  }

  var date = DATE_RE.test(rawDate) ? rawDate : defaultDate();
  var note = String(rawNote || '').trim();
  var isIncome = activeModal.mode === 'income';
  var rec;

  if (isIncome) {
    rec = activeModal.editId ? state.incomes.filter(function(r) { return r.id === activeModal.editId; })[0] : null;
    if (!rec) { rec = { id: uid() }; state.incomes.push(rec); }
    rec.amount = amt;
    rec.note = note;
    rec.date = date;
  } else {
    rec = activeModal.editId ? state.payments.filter(function(r) { return r.id === activeModal.editId; })[0] : null;
    if (!rec) { rec = { id: uid() }; state.payments.push(rec); }
    var v = findV(activeModal.vid);
    rec.amount = amt;
    rec.note = note;
    rec.date = date;
    rec.vid = activeModal.vid;
    rec.iid = findI(v, activeModal.iid) ? activeModal.iid : null;
  }
  delete rec.ex;

  viewMonth = date.slice(0, 7);
  mark(false);
  closeModal();
  renderAll();

  var label = isIncome ? T().kIncome : T().addExpense;
  showToast((state.lang === 'ar' ? 'تم الحفظ: ' : 'Saved: ') + label + ' (' + money(amt) + ')');
}

function exportCsv() {
  var t = T(), sv = spentByValue(), si = spentByItem();
  function q(s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; }
  var rows = [[monthLabelFor(viewMonth)], [t.csvValue, t.csvSub, t.csvPlanned, t.csvSpent]];
  state.values.forEach(function(v) {
    rows.push([vName(v), '', v.planned || 0, sv[v.id] || 0]);
    v.items.forEach(function(i) { rows.push([vName(v), iName(v, i), '', si[i.id] || 0]); });
  });
  rows.push([]);
  rows.push([t.csvDate, t.csvType, t.csvValue, t.csvSub, t.csvNote, t.csvAmount]);
  monthPays().forEach(function(p) {
    var v = findV(p.vid), it = findI(v, p.iid);
    rows.push([p.date, t.csvExpense, v ? vName(v) : t.uncategorized, it ? iName(v, it) : '', p.note, p.amount]);
  });
  monthIncomes().forEach(function(x) {
    rows.push([x.date, t.csvIncome, '', '', x.note, x.amount]);
  });
  var csv = '\uFEFF' + rows.map(function(r) { return r.map(q).join(','); }).join('\r\n');
  saveFile('mizan-budget-' + viewMonth + '.csv', csv, 'text/csv').catch(function () {});
}

function backupJson() {
  saveFile('mizan-backup-' + TODAY + '.json', JSON.stringify(state), 'application/json').then(function () { showToast(T().backupDone); }).catch(function () {});
}

function arm(btn, run) {
  if (btn.dataset.armed) { run(); return; }
  btn.dataset.armed = '1';
  btn.dataset.orig = btn.innerHTML;
  btn.classList.add('armed');
  btn.textContent = btn.classList.contains('icon-btn') ? T().confirm : T().again;
  setTimeout(function() {
    if (btn.isConnected && btn.dataset.armed) {
      btn.innerHTML = btn.dataset.orig;
      delete btn.dataset.armed;
      btn.classList.remove('armed');
    }
  }, 3500);
}

function onInput(e) {
  var el = e.target, f = el.dataset && el.dataset.f;
  if (!f) return;

  if (activeModal && activeModal.type === 'sheet') {
    if (f === 'sAmount') { activeModal.amount = el.value; el.removeAttribute('aria-invalid'); }
    else if (f === 'sDate') { activeModal.date = el.value; }
    else if (f === 'sNote') { activeModal.note = el.value; }
    return;
  }

  var v = findV(el.dataset.v), it = findI(v, el.dataset.i);
  switch (f) {
    case 'income':
      state.income = parseNum(el.value);
      syncPercentageAmounts();
      break;
    case 'currency':
      state.currency = el.value.slice(0, 8);
      break;
    case 'vname':
      if (v) v.name = el.value;
      break;
    case 'vwhy':
      if (v) v.why = el.value;
      break;
    case 'iname':
      if (it) it.name = el.value;
      break;
    case 'vplanned':
      if (v) {
        v.planned = parseNum(el.value);
        v.pct = state.income > 0 ? Math.round(v.planned / state.income * 100) : 0;
      }
      break;
    case 'vpct':
      if (v) {
        v.pct = parseNum(el.value);
        v.planned = Math.round((state.income || 0) * (v.pct / 100));
      }
      break;
    default:
      return;
  }
  mark(true);
  if (view === 'plan') {
    renderSummary();
    updateTotals();
  } else {
    renderAll(el.id === 'drawerCur');
  }
}

function onClick(e) {
  var target = e.target;
  if (target.dataset && target.dataset.act === 'closeModal' && target.classList.contains('scrim')) {
    closeModal();
    return;
  }
  var b = target.closest('[data-act]');
  if (!b) return;
  var a = b.dataset.act, v = findV(b.dataset.v), t = T();

  switch (a) {
    /* Drawer */
    case 'openDrawer':
      drawerOpen = true;
      renderDrawer();
      return;
    case 'closeDrawer':
      drawerOpen = false;
      renderDrawer();
      return;
    case 'setStyle':
      var newStyle = b.dataset.style;
      if (state.profiles[newStyle]) {
        state.profiles[state.style] = state.values;
        state.style = newStyle;
        state.values = state.profiles[newStyle];
        syncPercentageAmounts();
        if (state.example) {
          state.payments = buildExamplePayments(newStyle, state.values);
        }
        drawerOpen = false;
        mark(false);
        renderAll();
        var sLabel = newStyle === 'expenses' ? t.styleExpensesTitle : (newStyle === 'percentage' ? t.stylePctTitle : t.styleValuesTitle);
        showToast(t.toastStyleChanged + sLabel);
      }
      return;
    case 'lang':
      state.lang = b.dataset.lang;
      mark(false);
      renderAll();
      return;
    case 'theme':
      state.theme = b.dataset.theme;
      mark(false);
      renderAll();
      return;

    /* Tutorial Video & Buying Options */
    case 'openTutorial':
      openTutorial();
      return;
    case 'tutToggle':
      activeModal.playing = !activeModal.playing;
      if (activeModal.playing) startTutTimer(); else stopTutTimer();
      renderModal();
      return;
    case 'tutNext':
      if (activeModal.step < t.tutSteps.length - 1) {
        activeModal.step++;
        tutProg = 0;
        renderModal();
      }
      return;
    case 'tutPrev':
      if (activeModal.step > 0) {
        activeModal.step--;
        tutProg = 0;
        renderModal();
      }
      return;
    case 'tutStep':
      activeModal.step = +b.dataset.step || 0;
      tutProg = 0;
      renderModal();
      return;
    case 'openBuy':
      openBuyModal();
      return;
    case 'activatePro':
      var url = b.dataset.tier === 'plus' ? CONFIG.plusUrl : CONFIG.proUrl;
      if (url) { openLink(url); return; }
      showToast(t.comingSoon);
      return;

    /* Navigation & Examples */
    case 'tab':
      view = b.dataset.view;
      appearOpen = null;
      renderAll();
      return;
    case 'monthPrev':
      viewMonth = shiftMonth(viewMonth, -1);
      renderAll();
      return;
    case 'monthNext':
      viewMonth = shiftMonth(viewMonth, 1);
      renderAll();
      return;
    case 'dismiss':
      state.example = false;
      mark(false);
      renderAll();
      return;
    case 'zero':
      state.payments = state.payments.filter(function(p) { return !p.ex; });
      state.incomes = state.incomes.filter(function(x) { return !x.ex; });
      state.values.forEach(function(x) { x.planned = 0; x.pct = 0; });
      state.income = 0;
      state.example = false;
      mark(false);
      renderAll();
      return;

    /* Modals / Transaction Sheet */
    case 'closeModal':
      closeModal();
      return;
    case 'tile':
      openSheet('expense', { vid: b.dataset.v });
      return;
    case 'addExpense':
      openSheet('expense');
      return;
    case 'addIncome':
      openSheet('income');
      return;
    case 'editPay':
      openSheet('expense', { editId: b.dataset.p });
      return;
    case 'editInc':
      openSheet('income', { editId: b.dataset.p });
      return;
    case 'pickVal':
      activeModal.vid = b.dataset.v;
      activeModal.iid = '';
      activeModal.manual = true;
      var vs = document.getElementById('sVals'), er = document.getElementById('sErr');
      if (vs) vs.classList.remove('bad');
      if (er) er.hidden = true;
      document.getElementById('sVals').innerHTML = valChipsHTML();
      document.getElementById('sSubs').innerHTML = subChipsHTML();
      return;
    case 'pickSub':
      activeModal.iid = b.dataset.i || '';
      activeModal.manual = true;
      document.getElementById('sSubs').innerHTML = subChipsHTML();
      return;
    case 'delSheet':
      arm(b, function() {
        if (activeModal.mode === 'income') state.incomes = state.incomes.filter(function(r) { return r.id !== activeModal.editId; });
        else state.payments = state.payments.filter(function(r) { return r.id !== activeModal.editId; });
        mark(false);
        closeModal();
        renderAll();
      });
      return;
    case 'submitSheet':
      e.preventDefault();
      saveSheet();
      return;
    case 'addValue':
      var nv = { id: uid(), k: null, name: '', why: '', color: PAL[state.values.length % PAL.length], icon: PICKABLE[state.values.length % PICKABLE.length], planned: 0, pct: 0, items: [] };
      state.values.push(nv);
      state.profiles[state.style] = state.values;
      mark(true);
      renderAll();
      var f1 = app.querySelector('[data-v="' + nv.id + '"][data-f="vname"]');
      if (f1) f1.focus();
      return;
    case 'toggleAppear':
      appearOpen = appearOpen === b.dataset.v ? null : b.dataset.v;
      renderAll();
      return;
    case 'setIcon':
      if (!v) return;
      v.icon = b.dataset.icon;
      mark(true);
      renderAll();
      return;
    case 'setColor':
      if (!v) return;
      v.color = b.dataset.color;
      mark(true);
      renderAll();
      return;
    case 'addItem':
      if (!v) return;
      var ni = { id: uid(), k: null, name: '' };
      v.items.push(ni);
      mark(true);
      renderAll();
      var fi = app.querySelector('[data-i="' + ni.id + '"][data-f="iname"]');
      if (fi) fi.focus();
      return;
    case 'removeItem':
      if (!v) return;
      state.payments.forEach(function(p) { if (p.iid === b.dataset.i) p.iid = null; });
      v.items = v.items.filter(function(i) { return i.id !== b.dataset.i; });
      mark(true);
      renderAll();
      return;
    case 'removeValue':
      if (!v) return;
      arm(b, function() {
        state.payments.forEach(function(p) { if (p.vid === v.id) { p.vid = null; p.iid = null; } });
        state.values = state.values.filter(function(x) { return x.id !== v.id; });
        state.profiles[state.style] = state.values;
        mark(true);
        renderAll();
      });
      return;
    case 'export':
      exportCsv();
      return;
    case 'backup':
      backupJson();
      return;
    case 'restoreFile':
      fileInput.click();
      return;
    case 'openUrl':
      if (b.dataset.url) openLink(b.dataset.url);
      return;
    case 'hintOk':
      try { localStorage.setItem('mizan-hint', '1'); } catch (e) {}
      renderAll();
      return;
    case 'clearPlan':
      arm(b, function() {
        state.values.forEach(function(x) { x.planned = 0; x.pct = 0; });
        state.example = false;
        drawerOpen = false;
        mark(false);
        renderAll();
      });
      return;
    case 'restore':
      arm(b, function() {
        var fresh = freshState();
        fresh.lang = state.lang;
        fresh.theme = state.theme;
        fresh.pro = state.pro;
        state = fresh;
        drawerOpen = false;
        persistLocal();
        renderAll();
      });
      return;
  }
}

function onSubmit(e) {
  if (e.target && e.target.id === 'sform') {
    e.preventDefault();
    if (activeModal && activeModal.type === 'sheet') saveSheet();
  }
}

[app, drawerRoot, modalRoot].forEach(function(el) {
  el.addEventListener('input', onInput);
  el.addEventListener('change', onInput);
  el.addEventListener('click', onClick);
  el.addEventListener('submit', onSubmit);
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (activeModal) closeModal();
    else if (drawerOpen) { drawerOpen = false; renderDrawer(); }
  }
});

/* Initial Render */
renderAll();

window.addEventListener('pagehide', persistLocal);
document.addEventListener('visibilitychange', function () { if (document.hidden) persistLocal(); });

(function boot() {
  if (!isNative() && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  }
  var App = cap('App');
  if (App && App.addListener) {
    App.addListener('backButton', function () {
      if (activeModal) { closeModal(); return; }
      if (drawerOpen) { drawerOpen = false; renderDrawer(); return; }
      if (view !== 'home') { view = 'home'; appearOpen = null; renderAll(); return; }
      if (App.exitApp) App.exitApp();
    });
  }
})();
})();
</script>
</body>
